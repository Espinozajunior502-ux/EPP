<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e40421">
<meta name="description" content="Verificación de EPP · Megablessing">
<title>Verificación EPP · Megablessing 2.0</title>
<style>
:root{
 --red:#e40421;--red2:#b9001a;--green:#198754;--amber:#c98200;--blue:#2563eb;
 --ink:#181818;--muted:#6b7280;--bg:#f4f3ef;--card:#fff;--line:#e6e4df;
 --shadow:0 10px 30px rgba(20,20,20,.07);--r:20px;--nav:78px;
}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{max-width:760px;margin:auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:rgba(244,243,239,.88);backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 2px 10px}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:contain;border-radius:12px}.brand .name{font-weight:850;line-height:1}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.iconbtn{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.view{padding:8px 0 30px}.hero{padding:12px 2px 8px}.eyebrow{font-size:12px;color:var(--muted);font-weight:700}.hero h1{font-size:28px;line-height:1.08;margin:5px 0}.hero p{margin:6px 0;color:var(--muted);font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat b{font-size:25px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:11px 0}.card h2,.card h3{margin:0 0 12px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 9px}.sectionhead h2{font-size:17px;margin:0}.muted{color:var(--muted);font-size:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:750;min-height:42px}.primary{background:var(--red);color:#fff}.outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{color:var(--red);border-color:#f2b7bf;background:#fff}.soft{background:#f7f6f2;border:1px solid var(--line)}.sm{min-height:34px;padding:7px 10px;border-radius:11px;font-size:12px}
.search{display:flex;gap:8px}.search input{flex:1}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#bdbdbd;box-shadow:0 0 0 3px rgba(228,4,33,.07)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:8px}.person{display:flex;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.profilePreview{width:82px;height:82px;flex:0 0 82px;border-radius:18px;background:#f1efea;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;overflow:hidden}.profilePreview img{width:100%;height:100%;object-fit:cover}.avatar{width:44px;height:44px;border-radius:14px;background:#f1efea;display:grid;place-items:center;font-weight:850;color:#444;flex:0 0 auto;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profilePreview{width:86px;height:86px;border-radius:22px;background:#f1efea;display:grid;place-items:center;overflow:hidden;font-weight:850;font-size:24px;color:#444;border:1px solid var(--line)}.profilePreview img{width:100%;height:100%;object-fit:cover}.personmain{min-width:0;flex:1}.personmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.personmain small{display:block;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;white-space:nowrap}.ok{background:#eaf7ef;color:#14753f}.bad{background:#fdecef;color:#b6001b}.warn{background:#fff4df;color:#8b5a00}.info{background:#edf3ff;color:#1d4ed8}.gray{background:#eee;color:#666}
.bottom{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(7px + env(safe-area-inset-bottom));width:min(720px,calc(100% - 18px));background:rgba(255,255,255,.93);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 35px rgba(0,0,0,.14);padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.navbtn{border:0;background:transparent;border-radius:16px;padding:8px 3px;color:#707070;font-size:10px;font-weight:750}.navbtn span{display:block;font-size:19px;margin-bottom:2px}.navbtn.active{background:#f8e8ea;color:var(--red)}
.progress{height:8px;border-radius:99px;background:#eceae5;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:99px}.epprow{border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;background:#fff}.epptop{display:flex;justify-content:space-between;gap:8px;align-items:center}.eppname{font-weight:800}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.choice{border:1px solid var(--line);background:#fafafa;border-radius:11px;padding:9px 4px;font-size:11px;font-weight:800}.choice.active.yes{background:#eaf7ef;border-color:#a9dfbd;color:#14753f}.choice.active.no{background:#fdecef;border-color:#efb5be;color:#b6001b}.choice.active.na{background:#fff4df;border-color:#efd49a;color:#8b5a00}.photoBtn{margin-top:8px;width:100%;text-align:left}.thumb{width:100%;max-height:180px;object-fit:cover;border-radius:13px;margin-top:8px}.signaturePad{display:block;width:100%;height:160px;border:1px solid var(--line);border-radius:13px;background:#fff;touch-action:none;cursor:crosshair}.signatureActions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}.empty{text-align:center;padding:30px 12px;color:var(--muted);font-size:13px}.kpiLine{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.kpiLine:last-child{border-bottom:0}.barrow{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:9px 0;font-size:11px}.bar{height:10px;background:#eceae5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}.modalback{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:15px 15px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(0,0,0,.2)}
@keyframes personSwitchIn{from{opacity:.25;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
#modalbody.person-switch{animation:personSwitchIn .32s cubic-bezier(.2,.75,.25,1) both;will-change:opacity,transform}
@media(prefers-reduced-motion:reduce){#modalbody.person-switch{animation:none}}.handle{width:42px;height:5px;border-radius:99px;background:#ddd;margin:0 auto 15px}.toast{position:fixed;z-index:100;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));background:#202020;color:#fff;border-radius:14px;padding:11px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.login{min-height:100vh;display:grid;place-items:center;padding:25px}.loginbox{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:25px;box-shadow:var(--shadow)}.loginlogo{width:120px;height:70px;object-fit:contain;display:block;margin:0 auto 15px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}.calday{min-height:54px;padding:7px 2px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px}.calday.mutedday{opacity:.35}.calday.selected{border:2px solid var(--red);background:#fff0f2;color:#9f0018;font-weight:850}.calday.todayday{box-shadow:inset 0 0 0 1px var(--blue)}.caldot{width:6px;height:6px;border-radius:50%;background:var(--red);display:block}.calweek{font-size:10px;text-align:center;color:var(--muted);font-weight:800;padding:4px 0}.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}.calnav strong{text-transform:capitalize}.calrecord{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.calrecord:last-child{border-bottom:0}.calrecord .avatar{width:42px;height:42px}.calrecordmain{min-width:0;flex:1}.calrecordmain b{display:block}.calrecordmain small{display:block;color:var(--muted);margin-top:3px}.calrecordactions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:390px){.calday{min-height:45px;border-radius:9px}.calrecord{align-items:flex-start;flex-wrap:wrap}.calrecordactions{width:100%;padding-left:52px}}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:560px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px}.table th{background:#f8f7f3}.dangerText{color:var(--red);font-weight:800}
@media(min-width:650px){.grid4{grid-template-columns:repeat(4,1fr)}.bottom{width:650px}.choices{grid-template-columns:repeat(3,120px)}}
body.dark{--bg:#111214;--card:#191a1d;--ink:#f2f2f2;--muted:#a2a5ab;--line:#303238}.dark .top{background:rgba(17,18,20,.88)}.dark .outline,.dark .field input,.dark .field select,.dark .field textarea,.dark .person,.dark .epprow,.dark .stat,.dark .card,.dark .loginbox,.dark .choice,.dark .iconbtn{background:#191a1d;color:#f2f2f2;border-color:#303238}.dark .soft,.dark .bar,.dark .progress{background:#24262a}.dark .bottom{background:rgba(25,26,29,.94)}
.datebanner{background:#fff4df;color:#8b5a00;border:1px solid #efd49a;border-radius:13px;padding:9px 12px;font-size:12px;font-weight:700;margin:10px 0}
.dark .datebanner{background:#3a2e12;color:#f0cf85;border-color:#6b5420}
</style>
</head>

<div id="app" class="hidden">
<header class="top"><div class="app topin">

</nav>
</div>

const DBNAME='megablessing_epp_v2', VER=1;
let db, state={view:'home',personId:null,recordId:null,filter:'',historyPerson:'',historyDate:'',reportFrom:'',reportTo:'',editingEpp:null,editingPerson:null,inspectDate:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today=()=>dstr(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return dstr(d)};
const inspDate=()=>state.inspectDate||today();
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-EC',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const initials=n=>(String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?');
function avatarMarkup(p){return p?.foto?`<img class="avatar" src="${p.foto}" alt="Foto de ${esc(p.nombre||'trabajador')}" style="object-fit:cover">`:`<div class="avatar">${esc(initials(p?.nombre||'?'))}</div>`;}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').classList.add('hidden'),2200)}
function openModal(html){$('modalbody').innerHTML=html;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modalbody').innerHTML=''}
function reqStore(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function all(store){return new Promise((res,rej)=>{const r=reqStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const r=reqStore(store,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{const r=reqStore(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function get(store,id){return new Promise((res,rej)=>{const r=reqStore(store).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function activity(text){await put('activity',{id:uid(),date:new Date().toISOString(),text})}
function openDB(){
 return new Promise((res,rej)=>{
  const r=indexedDB.open(DBNAME,VER);
  r.onupgradeneeded=e=>{
   db=e.target.result;
   ['people','epp','inspectors','records','trash','activity'].forEach(n=>{if(!db.objectStoreNames.contains(n))db.createObjectStore(n,{keyPath:'id'})});
  };
  r.onsuccess=()=>{db=r.result;res()};
  r.onerror=()=>rej(r.error)
 })

function convertBase(b){
 const people=(b.personas||[]).map(p=>({id:p.id,nombre:p.nombre||'',cedula:'',cargo:p.cargo||'',area:'',foto:'',active:p.activo!==false}));
 const epp=(b.eppItems||[]).map(e=>({id:e.id,nombre:e.nombre,categoria:'',activo:e.activo!==false,na:true,foto:true}));
 const records=(b.registros||[]).map(r=>{
  const obs=(r.observaciones||'').trim();
  const items=(r.items||[]).map(i=>{const no=i.cumple===false;return {eppId:i.eppItemId,state:no?'no':'yes',note:no?obs:'',photo:'',fault:no?{status:'open',reason:obs}:null}});
  return {id:r.id,personId:r.personaId,date:r.fecha,inspectorId:0,inspector:r.inspector||'',items,obs,exemptionReason:'',exemptionDetail:'',exempted:false,ts:r.timestamp||Date.parse(r.fecha+'T12:00:00')};
 });
 return {people,epp,records};
}
async function loadBaseData(onlyMissing=true){
 const c=convertBase(BASE_DATA);let added=0;
 for(const [store,arr] of [['people',c.people],['epp',c.epp],['records',c.records]])
  for(const o of arr){if(onlyMissing&&await get(store,o.id))continue;await put(store,o);added++}
 return added;
}
async function loadBaseManual(){
 if(!confirm('Se agregarán los trabajadores, elementos EPP e inspecciones del respaldo base que todavía no existan en este dispositivo.\n\nNo se modifica ni se borra nada de lo que ya tienes. ¿Continuar?'))return;
 const n=await loadBaseData(true);await activity('Cargó datos base: '+n+' registros nuevos');toast(n?n+' registros agregados ✓':'Ya tenías todos los datos base');render();
}
async function seed(){
 // Primera ejecución en un dispositivo vacío: parte desde los datos base del respaldo JSON.
 if(!localStorage.getItem('eppBaseLoaded')){
  const nPeople=(await all('people')).length,nRec=(await all('records')).length;
  if(!nPeople&&!nRec){
   for(const e of await all('epp'))await del('epp',e.id); // EPP por defecto sin uso
   await loadBaseData(false);
   await activity('Cargó datos base del respaldo del '+String(BASE_DATA.exportadoEn||'').slice(0,10));
  }
  localStorage.setItem('eppBaseLoaded','1');
 }
 if(!(await all('inspectors')).length){
  await put('inspectors',{id:uid(),nombre:'Inspector principal',firma:''});
 }
}

let signatureDrawing=false,signatureHasInk=false;
function initSignatureCanvas(saved){const c=$('inf');if(!c)return;const ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(1,Math.round(rect.width*dpr));c.height=Math.max(1,Math.round(rect.height*dpr));ctx.scale(dpr,dpr);ctx.lineWidth=2.5;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#181818';signatureHasInk=!!saved;if(saved){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.onerror=()=>{signatureHasInk=false};img.src=saved;}const point=e=>{const r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};c.onpointerdown=e=>{e.preventDefault();signatureDrawing=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();signatureHasInk=true};c.onpointermove=e=>{if(!signatureDrawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};const stop=()=>{signatureDrawing=false};c.onpointerup=stop;c.onpointercancel=stop;c.onlostpointercapture=stop;}

async function deleteRecordForever(id){
 const r=await get('records',id);if(!r)return toast('La inspección ya no existe');
 const p=await get('people',r.personId),name=p?.nombre||'trabajador';
 if(!confirm(`¿Eliminar DEFINITIVAMENTE la inspección de ${name} del ${fmt(r.date)}?\n\nNo irá a la papelera y no se podrá recuperar. Si deseas conservarla, cancela y usa “Enviar a papelera”.`))return;
 await del('records',id);await activity(`Eliminó definitivamente la inspección de ${name} del ${r.date}`);closeModal();toast('Inspección eliminada definitivamente');await renderInspect();
}
function printSelectedPersonReport(){const id=Number($('reportPerson')?.value||0);if(!id)return toast('Selecciona un trabajador para el reporte individual');return printDetailedReport(id)}
async function printDetailedReport(personId=0){
 // Abrir la ventana en el mismo gesto del clic para evitar el bloqueo de ventanas emergentes.
 const w=window.open('','_blank');
 if(!w){toast('El navegador bloqueó la ventana. Permite las ventanas emergentes para este archivo y vuelve a pulsar el reporte.');return}
 w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Preparando reporte…</title></head><body style="font-family:Arial;padding:24px">Preparando reporte de inspecciones…</body></html>');
 try {
 const [allRecords,people,epps]=await Promise.all([all('records'),all('people'),all('epp')]);
 const from=state.reportFrom||'',to=state.reportTo||'';
 let records=allRecords.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to)&&(personId===0||r.personId===personId)).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
 if(personId&&!people.some(p=>p.id===personId)){w.close();toast('Selecciona un trabajador válido');return}
 if(!records.length){w.close();toast('No hay inspecciones en el periodo seleccionado');return;}
 const peopleWithRecords=personId?[people.find(p=>p.id===personId)]:people.filter(p=>records.some(r=>r.personId===p.id)).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
 const status=i=>i.state==='yes'?'Cumple':i.state==='no'?'No cumple':'N/A';
 const profile=p=>`<div class="profile"><div class="photo">${p?.foto?`<img src="${p.foto}" alt="Foto de perfil">`:`<div class="noPhoto">${esc(initials(p?.nombre||'?'))}</div>`}</div><div class="pdata"><h2>${esc(p?.nombre||'Trabajador eliminado')}</h2><p><b>Cédula:</b> ${esc(p?.cedula||'No registrada')} &nbsp; <b>Cargo:</b> ${esc(p?.cargo||'No registrado')}</p><p><b>Área:</b> ${esc(p?.area||'No registrada')} &nbsp; <b>Estado:</b> ${p?.active===false?'Inactivo':'Activo'}</p><p><b>Inspecciones en el periodo:</b> ${records.filter(r=>r.personId===p?.id).length}</p></div></div>`;
 const reportPeople=peopleWithRecords.map(p=>{const prs=records.filter(r=>r.personId===p?.id);return `<section class="personReport">${profile(p)}${prs.map(r=>`<article class="inspection"><div class="inspectionHead"><div><h3>Inspección · ${fmt(r.date)}</h3><p><b>Inspector:</b> ${esc(r.inspector||'Sin inspector')} &nbsp; <b>Estado:</b> ${r.exempted?'Exonerado':r.items.some(i=>i.state==='no')?'Con faltas':'Cumple'}</p></div></div>${r.exempted?`<p class="exempt"><b>Exoneración:</b> ${esc(r.exemptionReason||'—')} ${esc(r.exemptionDetail||'')}</p>`:''}<table><thead><tr><th>Elemento EPP</th><th>Resultado</th><th>Motivo / observación</th><th>Evidencia</th></tr></thead><tbody>${r.items.map(i=>{const e=epps.find(x=>x.id===i.eppId);return `<tr><td>${esc(i.eppName||e?.nombre||'EPP '+i.eppId)}</td><td class="${i.state==='no'?'bad':i.state==='yes'?'ok':''}">${status(i)}</td><td>${esc(i.note||i.fault?.reason||'—')}${i.fault?.closure?`<p><b>Corrección:</b> ${esc(i.fault.closure)}</p>`:''}</td><td>${i.photo?`<img class="evidence" src="${i.photo}" alt="Evidencia">`:'—'}</td></tr>`}).join('')}</tbody></table>${r.obs?`<p><b>Observaciones generales:</b> ${esc(r.obs)}</p>`:''}</article>`).join('')}</section>`}).join('');
 w.document.open();
 w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte de inspecciones EPP</title><style>
 body{font:12px Arial,sans-serif;color:#222;margin:24px}h1{color:#c9001c;margin-bottom:4px}.subtitle{color:#555;margin-top:0}.profile{display:flex;gap:16px;align-items:center;border:1px solid #ccc;padding:12px;border-radius:10px;margin:18px 0 10px;break-inside:avoid}.photo{width:100px;height:100px;flex:0 0 100px;border:1px solid #ddd;border-radius:8px;overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover}.noPhoto{font-size:26px;color:#666}.pdata h2{margin:0 0 8px}.pdata p{margin:4px 0}.personReport{break-before:page}.personReport:first-of-type{break-before:auto}.inspection{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;break-inside:avoid}.inspectionHead{display:flex;justify-content:space-between;align-items:start}.inspection h3{margin:0 0 5px}.inspection p{margin:6px 0}table{border-collapse:collapse;width:100%;margin-top:8px}th,td{border:1px solid #ccc;padding:7px;text-align:left;vertical-align:top}th{background:#f1f1f1}.ok{color:#16733c;font-weight:bold}.bad{color:#b6001b;font-weight:bold}.evidence{max-width:130px;max-height:100px;object-fit:contain}.exempt{background:#fff3d6;padding:8px}.summary{background:#f5f5f5;padding:10px;border-radius:8px}@media print{body{margin:10mm}.inspection{break-inside:avoid}}</style></head><body><h1>Reporte de Verificación de EPP · Megablessing</h1><p class="subtitle">Periodo: ${from?fmt(from):'Desde el inicio'} al ${to?fmt(to):'Hasta la fecha'} · Generado: ${new Date().toLocaleString('es-EC')} · Inspecciones: ${records.length}</p><div class="summary">Reporte ${personId?'individual':'general'} · Trabajadores incluidos: ${peopleWithRecords.length}</div>${reportPeople}<script>window.onload=()=>{setTimeout(()=>window.print(),500)};<\/script></body></html>`);
 w.document.close();
 } catch(err) { console.error(err); try { w.document.body.innerHTML='<p>No se pudo generar el reporte. Cierra esta ventana e inténtalo de nuevo.</p>' } catch {} toast('No se pudo generar el reporte'); }
}
